# Hier starten die Template Sensoren(neue Syntax)
template:
  - sensor:
      - name: "WPW Heatflow (corrected)"
        unique_id: wpw_heatflow_corrected
        unit_of_measurement: "W"
        state: >-
          {% if states('binary_sensor.wpw_os1_compressor') == "on" %}
            {{ (( (states('sensor.wpw_delta_t') | float) -0.6) * (states('sensor.wpw_pump_flow') | float * 1000 / 3600 * 4182) ) | round(0) | int }}
          {% else %}
            0
          {% endif %}

      #      - name: "WPW COP STAT(OLD)"
      #        unique_id: wpw_cop_stat_old
      #        state: >-
      #          {% if is_number(states('sensor.wpw_cop')) and (states('sensor.wpw_cop')) | float > 0 %}
      #            {{ states('sensor.wpw_cop') | float }}
      #          {% else %}
      #            {{ none }}
      #          {% endif %}

      # Corrrected values: if COP is shown as 0 or exceed values the value is set to None
      - name: "WPW COP STAT"
        unique_id: wpw_cop_stat
        unit_of_measurement: ""
        state: >
          {% set v = states('sensor.wpw_cop') %}
          {% set v_num = v | float(0) %}
          {% set last = state_attr('sensor.wpw_cop_stat', 'last_valid') | float(0) %}

          {% if v in ['unknown','unavailable','none',''] %}
            {{ none }}
          {% elif v_num <= 0 %}
            {{ none }}
          {% elif v_num > 9 %}
            {{ last }}
          {% else %}
            {{ v_num }}
          {% endif %}
        attributes:
          last_valid: >
            {% set v = states('sensor.wpw_cop') | float(0) %}
            {% set last = state_attr('sensor.wpw_cop_stat', 'last_valid') | float(0) %}
            {% if v > 0 and v <= 9 %}
              {{ v }}
            {% else %}
              {{ last }}
            {% endif %}

      # Neue gefilterte Sensoren für EEV Steps - als Integer
      - name: "WPW EEV1 Step Clean"
        unique_id: wpw_eev1_step_clean
        unit_of_measurement: "Steps"
        state: >
          {% set raw_value = states('sensor.wpw_eev1_step') | float(default=0) %}
          {% if raw_value >= 0 and raw_value <= 500 %}
            {{ (raw_value | int) }}
          {% else %}
            {% set last_value = states('sensor.wpw_eev1_step_clean') | default(0) | float %}
            {{ (last_value | int) }}
          {% endif %}

      - name: "WPW EEV2 Step Clean"
        unique_id: wpw_eev2_step_clean
        unit_of_measurement: "Steps"
        state: >
          {% set raw_value = states('sensor.wpw_eev2_step') | float(default=0) %}
          {% if raw_value >= 0 and raw_value <= 500 %}
            {{ (raw_value | int) }}
          {% else %}
            {% set last_value = states('sensor.wpw_eev2_step_clean') | default(0) | float %}
            {{ (last_value | int) }}
          {% endif %}

  - binary_sensor:
      - name: "WPW OS1 Compressor"
        unique_id: wpw_os1_compressor
        state: "{{ states('sensor.wpw_output_symbol1_compressor_status') }}"


  - sensor:
    - device_class: temperature
      unit_of_measurement: °C
      default_entity_id: sensor.owm_temperature_hourly_fixed
      name: OWM Temperature Hourly Fixed Mean
      state: "{% set start_time = now().replace(minute=0, second=0, microsecond=0) -
        timedelta(hours=1) %} {% set end_time = now().replace(minute=0, second=0, microsecond=0)
        %} {% set history_data = state_attr('sensor.openweathermap_temperature', 'history')
        %} {% if history_data %}\n  {% set relevant_states = history_data | selectattr('last_updated',
        '>=', as_timestamp(start_time)) | selectattr('last_updated', '<', as_timestamp(end_time))
        | list %}\n  {% if relevant_states %}\n    {% set values = relevant_states |
        map(attribute='state') | map('float') | list %}\n    {{ (values | sum / values
        | count) | round(1) }}\n  {% else %}\n    {{ states('sensor.openweathermap_temperature')
        | float | round(1) }}\n  {% endif %}\n{% else %}\n  {{ states('sensor.openweathermap_temperature')
        | float | round(1) }}\n{% endif %}"
        #
# Filter Sensoren und History Stats bleiben wie bisher
sensor:
  #  - platform: filter
  #    name: "WPW Mittlerer COP (1h)"
  #    entity_id: sensor.wpw_cop_stat
  #    filters:
  #      - filter: time_simple_moving_average
  #        window_size: "01:00"
  #        precision: 2

  #  - platform: filter
  #    name: "WPW Mittlerer COP (24h)"
  #    entity_id: sensor.wpw_cop_stat
  #    filters:
  #      - filter: time_simple_moving_average
  #        window_size: "24:00"
  #        precision: 2

  - platform: history_stats
    name: "WPW Betriebszeit des Kompressors"
    entity_id: binary_sensor.wpw_os1_compressor
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "WPW Anzahl der Kompressorstarts"
    entity_id: binary_sensor.wpw_os1_compressor
    state: "on"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

  - platform: integration
    source: sensor.wpw_heatflow_corrected
    name: "WPW Heat Energy Total (Corr.)"
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: statistics
    name: "OWM Temperature Hourly Mean"
    entity_id: sensor.openweathermap_temperature
    state_characteristic: mean # Geändert von state_type zu state_characteristic
    sampling_size: 60
    max_age:
      hours: 1

automation:
  - alias: "Update Hourly Temperature Mean at Full Hour"
    description: "Update hourly temperature mean at the beginning of each hour"
    trigger:
      - trigger: time_pattern
        minutes: "0"
    action:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.owm_temperature_hourly_fixed
