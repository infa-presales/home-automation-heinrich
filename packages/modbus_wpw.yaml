modbus:
  - name: wpw_modbus
    type: tcp
    host: !secret wpw_modbus_host_ip
    port: !secret wpw_modbus_port
    delay: 5
    timeout: 10
    sensors:
      - name: MB WPW COP
        unique_id: mb_wpw_cop
        device_address: !secret wpw_modbus_slave
        address: 0x1
        input_type: holding
        scale: 0.1
        precision: 1
        unit_of_measurement: ""
        data_type: int16
        scan_interval: 30

input_number:
  wpw_p01_heating_setp:
    name: "WPW P01 Heating Setpoint"
    initial: 35
    min: 10
    max: 55
    step: 0.5
  wpw_p02_cooling_setp:
    name: "WPW P01 Cooling Setpoint"
    initial: 20
    min: 12
    max: 30
    step: 0.5
  wpw_p03_temp_diff:
    name: "WPW P03 Temp Diff"
    initial: 2
    min: 2
    max: 18
    step: 1
  wpw_p04_hotwater_setp:
    name: "WPW P04 Hotwater Setp"
    initial: 35
    min: 10
    max: 55
    step: 0.5
  wpw_p05_temp_diff:
    name: "WPW P05 Temp Diff"
    initial: 2
    min: 2
    max: 18
    step: 1
  wpw_f39_ac_const_temp_diff:
    name: WPW F39 AC Const Temp Diff
    initial: 2
    min: 0
    max: 10
    step: 1
  wpw_f40_wt_const_temp_diff:
    name: WPW F40 WT Const Temp Diff
    initial: 0
    min: 0
    max: 10
    step: 1
  wpw_f42_wasser_temp_diff:
    name: WPW F42 Wasser Temp Diff
    initial: 0
    min: 0
    max: 10
    step: 1
  wpw_f43_inlet_temp_diff:
    name: WPW F43 Inlet Temp Diff
    initial: 0
    min: 0
    max: 10
    step: 1
  wpw_f44_temp_calibration:
    name: WPW F44 Temp Calibration
    initial: 2
    min: 0
    max: 3
    step: 0.1
  wpw_f45_inlet_temp_calibration:
    name: WPW F45 Inlet Temp Calibration
    initial: 0
    min: 0
    max: 3
    step: 0.1
  wpw_f46_outlet_temp_calibration:
    name: WPW F46 Outlet Temp Calibration
    initial: 1
    min: 0
    max: 3
    step: 0.1
  wpw_g03_start_internal:
    name: WPW G03 Start Internal
    initial: 5
    min: 1
    max: 120
    step: 1
  wpw_g04_delta_temp_set:
    name: WPW G04 Delta Temp Set
    initial: 5
    min: 1
    max: 30
    step: 1
  wpw_g04_delta_temp_set2:
    name: WPW G04 Delta Temp Set2
    initial: 5
    min: 1
    max: 30
    step: 1

input_select:
  wpw_p06_unit_mode:
    name: "WPW P06 Unit Mode"
    options:
      - "DHW"
      - "Heating"
      - "Cooling"
      - "Heating+DHW"
      - "Cooling+DHW"
    icon: mdi:heat-pump
  wpw_p07_fan_mode:
    name: "WPW P07 FAN Mode"
    options:
      - "NOR"
      - "ECO"
      - "Night"
      - "Hi-COP"
    icon: mdi:fan
  wpw_g02_pump_work:
    name: "WPW G02 Pump Work"
    options:
      - "Interval"
      - "Normal"
      - "Demand"
    icon: mdi:pump

input_boolean:
  wpw_pmd_switch:
    name: "WPW PMD Switch On/Off"
  wpw_pmd_main_valve_selection:
    name: "WPW PMD Main Valve Selection"
  wpw_pmd_manual_frequency_selection:
    name: "WPW PMD Manual Frequency Selection"
  wpw_pmd_auxiliary_valve_initial_opening:
    name: "WPW PMD Auxiliary Valve Initial Opening"
  wpw_pmd_expansion_valve_initial_opening:
    name: "WPW PMD Expansion Valve Initial Opening"
  wpw_cm1_thermostatic_adjustment:
    name: "WPW CM1 Thermostatic Adjustment"
  wpw_cm1_pressure_sensor_valid:
    name: "WPW CM1 Pressure Sensor Valid"
  wpw_cm1_cooling_auxiliary_circuit_enable:
    name: "WPW CM1 Cooling Auxiliary Circuit Enable"
  wpw_cm1_auxiliary_expansion_valve_mode:
    name: "WPW CM1 Auxiliary Expansion Valve Mode"
  wpw_cm1_dc_fan1_selection:
    name: "WPW CM1 DC Fan1 Selection"
  wpw_cm1_dc_fan2_selection:
    name: "WPW CM1 DC Fan2 Selection"
  wpw_cm1_parameter_reset_selection:
    name: "WPW CM1 Parameter Reset Selection"
  wpw_cm1_lockout_fault_reset_selection:
    name: "WPW CM1 Lockout Fault Reset Selection"
  wpw_cm2_with_or_without_antilegionella:
    name: "WPW CM2 With Or Without Antilegionella"
  wpw_cm2_with_or_without_hot_water:
    name: "WPW CM2 With Or Without Hot Water"
  wpw_cm2_whether_the_clock_is_at_night:
    name: "WPW CM2 Whether The Clock Is At Night"
  wpw_cm2_load_fast_check_mode:
    name: "WPW CM2 Load Fast Check Mode"
  wpw_cm2_forced_defrost:
    name: "WPW CM2 Forced Defrost"
  wpw_cm2_with_or_without_smart_grid:
    name: "WPW CM2 With Or Without Smart Grid"
  wpw_cm2_smart_grid_with_or_without_electric_heater:
    name: "WPW CM2 Smart Grid With Or Without Electric Heater"
  wpw_target_parm_edit_mode:
    name: "WPW Target Param Edit Mode"
    icon: mdi:lock-open-variant
  wpw_project_parm_edit_mode:
    name: "WPW Project Param Edit Mode"
    icon: mdi:lock-open-variant
  wpw_cm1_param_edit_mode:
    name: "WPW CM1 Param Edit Mode"
    icon: mdi:lock-open-variant
  wpw_cm2_param_edit_mode:
    name: "WPW CM2 Param Edit Mode"
    icon: mdi:lock-open-variant
  wpw_demand_param_edit_mode:
    name: "WPW Demand Param Edit Mode"
    icon: mdi:lock-open-variant

script:
  wpw_project_param_reset_to_actual:
    alias: "Project parameter auf Ist setzen"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.wpw_g02_pump_work
        data:
          option: >
            {% set mode_map = { 0: "Interval", 1: "Normal", 2: "Demand" } %}
            {{ mode_map[states('sensor.wpw_g02_pump_work') | int(1)] | default("Normal") }}
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_g03_start_internal
        data:
          value: "{{ states('sensor.wpw_g03_start_internal') | float(5) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_g04_delta_temp_set
        data:
          value: "{{ states('sensor.wpw_g04_delta_temp_set') | float(5) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_g04_delta_temp_set2
        data:
          value: "{{ states('sensor.wpw_g04_delta_temp_set2') | float(3) }}"

  wpw_target_param_reset_to_actual:
    alias: "Zielparameter auf Ist setzen"
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_p01_heating_setp
        data:
          value: "{{ states('sensor.wpw_p01_heating_setp') | float(27) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_p02_cooling_setp
        data:
          value: "{{ states('sensor.wpw_p02_cooling_setp') | float(12) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_p03_temp_diff
        data:
          value: "{{ states('sensor.wpw_p03_temp_diff') | float(5) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_p04_hotwater_setp
        data:
          value: "{{ states('sensor.wpw_p04_hotwater_setp') | float(50) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_p05_temp_diff
        data:
          value: "{{ states('sensor.wpw_p05_temp_diff') | float(5) }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.wpw_p06_unit_mode
        data:
          option: >
            {% set mode_map = { 0: "DHW", 1: "Heating", 2: "Cooling", 3: "Heating+DHW", 4: "Cooling+DHW" } %}
            {{ mode_map[states('sensor.wpw_p06_unit_mode') | int(1)] | default("Heating") }}
      - action: input_select.select_option
        target:
          entity_id: input_select.wpw_p07_fan_mode
        data:
          option: >
            {% set mode_map = { 0: "NOR", 1: "ECO", 2: "Night", 3: "Hi-COP" } %}
            {{ mode_map[states('sensor.wpw_p07_fan_mode') | int(1)] | default("ECO") }}
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_f39_ac_const_temp_diff
        data:
          value: "{{ states('sensor.wpw_f39_ac_const_temp_diff') | float(2) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_f40_wt_const_temp_diff
        data:
          value: "{{ states('sensor.wpw_f40_wt_const_temp_diff') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_f42_wasser_temp_diff
        data:
          value: "{{ states('sensor.wpw_f42_wasser_temp_diff') | float(5) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_f43_inlet_temp_diff
        data:
          value: "{{ states('sensor.wpw_f43_inlet_temp_diff') | float(5) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_f44_temp_calibration
        data:
          value: "{{ states('sensor.wpw_f44_temp_calibration') | float(0.2) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_f45_inlet_temp_calibration
        data:
          value: "{{ states('sensor.wpw_f45_inlet_temp_calibration') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.wpw_f46_outlet_temp_calibration
        data:
          value: "{{ states('sensor.wpw_f46_outlet_temp_calibration') | float(0.1) }}"

  wpw_send_project_param:
    alias: "Project Parameter an WP übertragen"
    sequence:
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 414 # 0x19E
          value: >
            {% set mode_map = { "Interval": 0, "Normal": 1, "Demand": 2 } %}
            {{ mode_map[states('input_select.wpw_g02_pump_work')] | default(1) }}
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 389 # 0x0185
          value: "{{ states('input_number.wpw_g03_start_internal') | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 397 # 0x018D
          value: "{{ states('input_number.wpw_g04_delta_temp_set') | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 221 # 0x00DD
          value: "{{ states('input_number.wpw_g04_delta_temp_set2') | int }}"

  wpw_send_target_param:
    alias: "Target Parameter an WP übertragen"
    sequence:
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 204 # 0xCC
          value: "{{ (states('input_number.wpw_p01_heating_setp') | float * 2) | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 203 # 0xCB
          value: "{{ (states('input_number.wpw_p02_cooling_setp') | float * 2) | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 198 # 0xC6
          value: "{{ states('input_number.wpw_p03_temp_diff') | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 202 # 0xCA
          value: "{{ (states('input_number.wpw_p04_hotwater_setp') | float * 2) | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 200 # 0xC8
          value: "{{ states('input_number.wpw_p05_temp_diff') | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 54 # 0x36
          value: >
            {% set mode_map = { "DHW": 0, "Heating": 1, "Cooling": 2, "Heating+DHW": 3, "Cooling+DHW": 4 } %}
            {{ mode_map[states('input_select.wpw_p06_unit_mode')] | default(1) }}
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 400 # 0x190
          value: >
            {% set mode_map = { "NOR": 0, "ECO": 1, "Night": 2, "Hi-COP": 3 } %}
            {{ mode_map[states('input_select.wpw_p07_fan_mode')] | default(1) }}
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 199 # 0x00C7
          value: "{{ states('input_number.wpw_f39_ac_const_temp_diff') | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 201 # 0x00C9
          value: "{{ states('input_number.wpw_f40_wt_const_temp_diff') | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 210 # 0x00D2
          value: "{{ states('input_number.wpw_f42_wasser_temp_diff') | int }}"
      - action: modbus.write_register
        target: {}
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 211 # 0x00D3
          value: "{{ states('input_number.wpw_f43_inlet_temp_diff') | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 205 # 0x00CD
          value: "{{ (states('input_number.wpw_f44_temp_calibration') | float * 10) | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 206 # 0x00CE
          value: "{{ (states('input_number.wpw_f45_inlet_temp_calibration') | float * 10) | int }}"
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 207 # 0x00CF
          value: "{{ (states('input_number.wpw_f46_outlet_temp_calibration') | float * 10) | int }}"

automation:
  - alias: "WPW: Sync Edit Mode on target param"
    trigger:
      - platform: state
        entity_id: input_boolean.wpw_target_parm_edit_mode
        to: "on"
    action:
      - action: script.wpw_target_param_reset_to_actual

  - alias: "WPW: Sync Edit Mode on project param"
    trigger:
      - platform: state
        entity_id: input_boolean.wpw_project_parm_edit_mode
        to: "on"
    action:
      - action: script.wpw_project_param_reset_to_actual

  - alias: "Write Parameter Marker Definition Register"
    mode: single
    trigger:
      - trigger: state
        entity_id:
          - input_boolean.wpw_pmd_switch
          - input_boolean.wpw_pmd_main_valve_selection
          - input_boolean.wpw_pmd_manual_frequency_selection
          - input_boolean.wpw_pmd_auxiliary_valve_initial_opening
          - input_boolean.wpw_pmd_expansion_valve_initial_opening
    action:
      - action: modbus.write_register
        data:
          hub: wpw_modbus
          slave: !secret wpw_modbus_slave
          address: 50 # 0x32
          value: >
            {% set bit0 = 1 if is_state('input_boolean.wpw_pmd_switch', 'on') else 0 %}
            {% set bit1 = 2 if is_state('input_boolean.wpw_pmd_main_valve_selection', 'on') else 0 %}
            {% set bit2 = 4 if is_state('input_boolean.wpw_pmd_manual_frequency_selection', 'on') else 0 %}
            {% set bit5 = 32 if is_state('input_boolean.wpw_pmd_auxiliary_valve_initial_opening', 'on') else 0 %}
            {% set bit6 = 64 if is_state('input_boolean.wpw_pmd_expansion_valve_initial_opening', 'on') else 0 %}
            {{ bit0 + bit1 + bit2 + bit5 + bit6 }}
