              - type: custom:plotly-graph
                title: Heizkurve Vorschau
                hours_to_show: current_day
                refresh_interval: 1
                entities:
                  - entity: input_number.wpw_curve_temp1
                    name: Heizkurve
                    x: |-
                      $ex [
                        parseFloat(hass.states['input_number.wpw_curve_amb1'].state),
                        parseFloat(hass.states['input_number.wpw_curve_amb2'].state),
                        parseFloat(hass.states['input_number.wpw_curve_amb3'].state),
                        parseFloat(hass.states['input_number.wpw_curve_amb4'].state)
                      ]
                    'y': |-
                      $ex [
                        parseFloat(hass.states['input_number.wpw_curve_temp1'].state),
                        parseFloat(hass.states['input_number.wpw_curve_temp2'].state),
                        parseFloat(hass.states['input_number.wpw_curve_temp3'].state),
                        parseFloat(hass.states['input_number.wpw_curve_temp4'].state)
                      ]
                    line:
                      color: orange
                      width: 3
                      shape: linear
                    mode: lines+markers
                    subscribe_entities:
                      - input_number.wpw_curve_temp1
                      - input_number.wpw_curve_temp2
                      - input_number.wpw_curve_temp3
                      - input_number.wpw_curve_temp4
                      - input_number.wpw_curve_amb1
                      - input_number.wpw_curve_amb2
                      - input_number.wpw_curve_amb3
                      - input_number.wpw_curve_amb4
                  - entity: input_number.wpw_curve_temp3
                    name: Pivot
                    x: >-
                      $ex
                      [parseFloat(hass.states['input_number.wpw_curve_amb3'].state)]
                    'y': >-
                      $ex
                      [parseFloat(hass.states['input_number.wpw_curve_temp3'].state)]
                    mode: markers
                    marker:
                      size: 12
                      color: red
                      symbol: diamond
                layout:
                  height: 250
                  margin:
                    t: 30
                    b: 40
                    l: 50
                    r: 20
                  xaxis:
                    type: linear
                    autorange: false
                    range:
                      - -20
                      - 20
                    title: Außentemperatur [°C]
                  yaxis:
                    type: linear
                    autorange: false
                    range:
                      - 10
                      - 55
                    title: Vorlauf [°C]
              - type: entities
                title: 1. Steuerung & Status
                show_header_toggle: false
                entities:
                  - entity: sensor.wpw_effektive_vl_temperatur
                    name: Aktueller Soll-Vorlauf
                  - entity: input_number.wpw_curve_slope
                    name: Steilheit
                  - entity: input_number.wpw_curve_temp3
                    name: Basis-Vorlauf (E15)
                  - entity: input_boolean.wpw_kurve_edit_mode
                    name: Erweiterte Einstellungen anzeigen
                    icon: mdi:lock-open-variant
              - type: conditional
                conditions:
                  - entity: input_boolean.wpw_kurve_edit_mode
                    state: 'on'
                card:
                  type: entities
                  entities:
                    - entity: input_number.wpw_curve_amb1
                      name: Min. Außentemp (E01)
                    - entity: input_number.wpw_curve_amb4
                      name: Max. Außentemp (E04)
              - type: horizontal-stack
                cards:
                  - type: button
                    name: Berechnen
                    icon: mdi:calculator
                    tap_action:
                      action: call-service
                      service: script.wpw_calc_engine
                  - type: button
                    name: Verwerfen
                    icon: mdi:undo
                    tap_action:
                      action: call-service
                      service: script.wpw_reset_to_actual
                  - show_name: true
                    show_icon: true
                    type: button
                    name: Senden
                    icon: mdi:transfer
                    tap_action:
                      action: call-service
                      service: script.wpw_send_heating_curve
              - type: entities
                title: 2. Berechnete Werte (Modbus)
                entities:
                  - entity: input_number.wpw_curve_temp1
                    name: Vorlauf 1 (E13)
                  - entity: input_number.wpw_curve_temp2
                    name: Vorlauf 2 (E14)
                  - entity: input_number.wpw_curve_temp3
                    name: Vorlauf 3 (E15)
                  - entity: input_number.wpw_curve_temp4
                    name: Vorlauf 4 (E16)
      - type: grid
        cards:
          - type: heading
            heading: Neuer Abschnitt
          - type: entities
            entities:
              - entity: sensor.wpw_ambient_temperature
                name: Außentemperatur WP
                secondary_info: last-updated
              - entity: sensor.wpw_effektive_vl_temperatur
                name: WPW Effektive VL Temperatur(var. Ziel)
                secondary_info: last-updated
              - entity: sensor.wpw_p07_fan_mode
                name: WPW P06 Fan Mode (numerisch, 1=ECO)
                secondary_info: last-updated
              - entity: sensor.wpw_p07_fan_mode_display
                secondary_info: last-updated
          - title: Verlauf
            type: history-graph
            hours_to_show: 38
            entities:
              - entity: sensor.wpw_ambient_temperature
                name: Außentemperatur Wärmepumpe
              - entity: sensor.wpw_effektive_vl_temperatur
                name: WPW Effektive VL Temperatur(var. Ziel)
              - entity: sensor.wpw_effective_target_temperature
                name: WPW Effektive Target Temp (alt)
                secondary_info: last-updated
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.wpw_timestamp
        color: ''
        name: Letzter Modbus update
  - type: sections
    max_columns: 4
    title: Fehler Status
    path: fehler-status
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Neuer Abschnitt
          - type: entities
            entities:
              - entity: sensor.wpw_fs1_ambient_temp
              - entity: sensor.wpw_fs1_coil_temp
              - entity: sensor.wpw_fs1_high_voltage_fault
              - entity: sensor.wpw_fs1_hotwater_temp
              - entity: sensor.wpw_fs1_outlet_temp
              - entity: sensor.wpw_fs1_powerfailure
            title: Fehler Status 1
          - type: entities
            entities:
              - entity: sensor.wpw_fs2_high_protection_of_heatung_water_outlet
              - entity: sensor.wpw_fs2_water_flow_switch_failure
            title: Fehler Status 2
          - type: entities
            entities:
              - entity: sensor.wpw_fs3_outlet_gas_temp_failure
            title: Fehler Status 3
      - type: grid
        cards:
          - type: heading
            heading: Neuer Abschnitt
          - type: entities
            entities:
              - entity: sensor.wpw_fs4_economy_into_temperature_sensor_failure
              - entity: sensor.wpw_fs4_economy_out_temperature_sensor_failure
              - entity: sensor.wpw_fs4_high_exhaust_temperature_protection
              - entity: sensor.wpw_fs4_overcooling_protection_ofcooling_outlet_water
              - entity: sensor.wpw_fs4_return_air_temperature_sensor_failure
              - entity: sensor.wpw_fs4_water_inlet_temp_sensor_failure
            title: Fehler Status 4
          - type: entities
            entities:
              - entity: sensor.wpw_fs5_high_pressure_sensor_failure
              - entity: sensor.wpw_fs5_high_protection_of_coil_temperature
              - entity: sensor.wpw_fs5_low_pressure_sensor_failure
              - entity: sensor.wpw_fs5_overpressure_protection_of_high_pressure
              - entity: sensor.wpw_fs5_underpressure_protection_of_low_pressure
            title: Fehler Status 5
      - type: grid
        cards:
          - type: heading
            heading: Neuer Abschnitt
          - type: entities
            entities:
              - entity: sensor.wpw_fs6_primary_antifreeze
              - entity: sensor.wpw_fs6_secondary_antifreeze
            title: Fehler Status 6
          - type: entities
            entities:
              - entity: sensor.wpw_fs7_dc_fan1_fault
              - entity: sensor.wpw_fs7_dc_fan2_fault
              - entity: sensor.wpw_fs7_inverter_module_communication_failure
              - entity: sensor.wpw_fs7_low_ring_temperature
            title: Fehler Status 7
