- platform: template
  switches:
    brennersperre:
      friendly_name: "Brennersperre"
      icon_template: mdi:power
      value_template: >
        {{ is_state('switch.shellyplus1_brennersperre1', 'on')
           or is_state('switch.shellyplus1_brennersperre2', 'on') }}
      turn_on:
        - service: switch.turn_on
          target:
            entity_id:
              - switch.shellyplus1_brennersperre1
              - switch.shellyplus1_brennersperre2
      turn_off:
        - service: switch.turn_off
          target:
            entity_id:
              - switch.shellyplus1_brennersperre1
              - switch.shellyplus1_brennersperre2
